<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aether UI — Playground</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../../packages/tokens-css/tokens.css"><style>
*{box-sizing:border-box}body{margin:0;background:var(--aether-semantic-background);color:var(--aether-semantic-text-primary);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}main{max-width:920px;margin:0 auto;padding:36px 20px}header,.row{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}h1{font-size:28px;letter-spacing:-.6px}p,.muted{color:var(--aether-semantic-text-secondary)}.panel{background:var(--aether-semantic-surface);border:1px solid var(--aether-semantic-border);border-radius:16px;padding:24px;margin-top:18px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.stat{background:var(--aether-semantic-surface-muted);padding:18px;border-radius:10px}.number{font-size:32px;font-weight:700}button{cursor:pointer;border:0;border-radius:10px;padding:10px 16px;font:inherit}button:focus-visible,input:focus-visible{outline:3px solid var(--aether-semantic-accent);outline-offset:3px}.primary{background:var(--aether-semantic-accent);color:white}.secondary{background:var(--aether-semantic-surface-muted);color:var(--aether-semantic-text-primary)}input{font:inherit;padding:10px;border:1px solid var(--aether-semantic-border);border-radius:10px;background:var(--aether-semantic-surface);color:var(--aether-semantic-text-primary);width:100%;max-width:320px}label{display:block;margin-bottom:6px;font-size:14px}.pill{color:var(--aether-semantic-success);font-weight:600}@media(prefers-reduced-motion:no-preference){button{transition:filter .12s}button:hover{filter:brightness(.95)}}
body{font-family:var(--aether-font-family-primary)}
body{min-height:100vh;background-image:radial-gradient(circle at 12% 8%,color-mix(in srgb,var(--aether-semantic-accent) 30%,transparent),transparent 34rem),radial-gradient(circle at 88% 84%,color-mix(in srgb,var(--aether-semantic-success) 18%,transparent),transparent 30rem);background-attachment:fixed}.panel,.stat,.secondary,input{border:1px solid var(--aether-semantic-glass-border);background:linear-gradient(145deg,var(--aether-semantic-glass-highlight),transparent 38%),var(--aether-semantic-glass-surface);box-shadow:inset 0 1px 0 var(--aether-semantic-glass-highlight),var(--aether-shadow-glass);-webkit-backdrop-filter:blur(var(--aether-glass-blur-medium)) saturate(var(--aether-glass-saturation));backdrop-filter:blur(var(--aether-glass-blur-medium)) saturate(var(--aether-glass-saturation))}.panel{border-radius:24px}.stat{border-radius:16px}.primary{border:1px solid rgb(255 255 255/.28);background:linear-gradient(180deg,color-mix(in srgb,var(--aether-semantic-accent) 78%,white),var(--aether-semantic-accent));box-shadow:inset 0 1px 0 rgb(255 255 255/.4),0 10px 24px color-mix(in srgb,var(--aether-semantic-accent) 28%,transparent)}@media(prefers-reduced-transparency:reduce){.panel,.stat,.secondary,input{background:var(--aether-semantic-surface);-webkit-backdrop-filter:none;backdrop-filter:none}}
.panel{background:var(--aether-semantic-glass-surface-strong)}.stats{padding:15px;border-radius:20px;background:radial-gradient(circle at 12% 78%,color-mix(in srgb,var(--aether-semantic-accent) 36%,transparent),transparent 50%),radial-gradient(circle at 92% 22%,color-mix(in srgb,var(--aether-semantic-success) 28%,transparent),transparent 45%),var(--aether-semantic-surface-muted)}.stat{background:linear-gradient(145deg,var(--aether-semantic-glass-highlight),transparent 44%),var(--aether-semantic-glass-surface)}input{background:var(--aether-semantic-glass-surface-strong);border-color:var(--aether-semantic-border);-webkit-backdrop-filter:none;backdrop-filter:none}@media(prefers-reduced-transparency:reduce){.panel,.stat,.secondary,input{background:var(--aether-semantic-surface);-webkit-backdrop-filter:none;backdrop-filter:none}}
button.primary{background:color-mix(in srgb,var(--aether-semantic-accent) 82%,black);border-color:transparent;box-shadow:0 5px 12px color-mix(in srgb,var(--aether-semantic-accent) 18%,transparent)}[data-theme=dark] button.primary{background:color-mix(in srgb,var(--aether-semantic-accent) 68%,black)}button.secondary{background:var(--aether-semantic-glass-surface-strong);box-shadow:0 5px 14px color-mix(in srgb,var(--aether-semantic-text-primary) 8%,transparent);-webkit-backdrop-filter:blur(var(--aether-glass-blur-small));backdrop-filter:blur(var(--aether-glass-blur-small))}@media(prefers-reduced-transparency:reduce){button.secondary{background:var(--aether-semantic-surface);-webkit-backdrop-filter:none;backdrop-filter:none}}
</style></head><body><main><header><div><div class="muted">AETHER UI · PLAYGROUND V0.3</div><h1>Vue d'ensemble</h1></div><button id="theme" class="secondary" type="button" aria-label="Changer le thème">Changer de thème</button></header><p>Exemple de composants alimentés par les tokens sémantiques et la couche Aether Glass.</p><section class="panel"><div class="row"><h2>Tableau de bord</h2><button class="primary" type="button" id="create">+ Créer un projet</button></div><div class="stats"><div class="stat"><div class="muted">Projets actifs</div><div class="number">12</div><span class="pill">+12,5 %</span></div><div class="stat"><div class="muted">Tâches terminées</div><div class="number">84</div><span class="pill">+8,2 %</span></div></div></section><section class="panel"><h2>Formulaire</h2><label for="project">Nom du projet</label><input id="project" placeholder="Ex. Mon application"><p><button class="primary" type="button" id="save">Enregistrer</button></p><p id="status" role="status" aria-live="polite"></p></section></main><script>const root=document.documentElement;document.getElementById('theme').onclick=()=>{root.dataset.theme=root.dataset.theme==='dark'?'light':'dark'};document.getElementById('create').onclick=()=>document.getElementById('project').focus();document.getElementById('save').onclick=()=>{const value=document.getElementById('project').value.trim();document.getElementById('status').textContent=value?'Projet « '+value+' » prêt à être créé (démo uniquement).':'Saisissez un nom de projet.'};</script></body></html>
