<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aether UI — Playground</title><link rel="stylesheet" href="../../packages/tokens-css/tokens.css"><style>
*{box-sizing:border-box}body{margin:0;background:var(--aether-semantic-background);color:var(--aether-semantic-text-primary);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}main{max-width:920px;margin:0 auto;padding:36px 20px}header,.row{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}h1{font-size:28px;letter-spacing:-.6px}p,.muted{color:var(--aether-semantic-text-secondary)}.panel{background:var(--aether-semantic-surface);border:1px solid var(--aether-semantic-border);border-radius:16px;padding:24px;margin-top:18px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.stat{background:var(--aether-semantic-surface-muted);padding:18px;border-radius:10px}.number{font-size:32px;font-weight:700}button{cursor:pointer;border:0;border-radius:10px;padding:10px 16px;font:inherit}button:focus-visible,input:focus-visible{outline:3px solid var(--aether-semantic-accent);outline-offset:3px}.primary{background:var(--aether-semantic-accent);color:white}.secondary{background:var(--aether-semantic-surface-muted);color:var(--aether-semantic-text-primary)}input{font:inherit;padding:10px;border:1px solid var(--aether-semantic-border);border-radius:10px;background:var(--aether-semantic-surface);color:var(--aether-semantic-text-primary);width:100%;max-width:320px}label{display:block;margin-bottom:6px;font-size:14px}.pill{color:var(--aether-semantic-success);font-weight:600}@media(prefers-reduced-motion:no-preference){button{transition:filter .12s}button:hover{filter:brightness(.95)}}
</style></head><body><main><header><div><div class="muted">AETHER UI · PLAYGROUND V0.1</div><h1>Vue d'ensemble</h1></div><button id="theme" class="secondary" type="button" aria-label="Changer le thème">Changer de thème</button></header><p>Exemple de composants alimentés par les tokens sémantiques.</p><section class="panel"><div class="row"><h2>Tableau de bord</h2><button class="primary" type="button" id="create">+ Créer un projet</button></div><div class="stats"><div class="stat"><div class="muted">Projets actifs</div><div class="number">12</div><span class="pill">+12,5 %</span></div><div class="stat"><div class="muted">Tâches terminées</div><div class="number">84</div><span class="pill">+8,2 %</span></div></div></section><section class="panel"><h2>Formulaire</h2><label for="project">Nom du projet</label><input id="project" placeholder="Ex. Mon application"><p><button class="primary" type="button" id="save">Enregistrer</button></p><p id="status" role="status" aria-live="polite"></p></section></main><script>const root=document.documentElement;document.getElementById('theme').onclick=()=>{root.dataset.theme=root.dataset.theme==='dark'?'light':'dark'};document.getElementById('create').onclick=()=>document.getElementById('project').focus();document.getElementById('save').onclick=()=>{const value=document.getElementById('project').value.trim();document.getElementById('status').textContent=value?'Projet « '+value+' » prêt à être créé (démo uniquement).':'Saisissez un nom de projet.'};</script></body></html>
